  /app/auth/gateway/refresh:
    post:
      tags:
      - App/Auth/Gateway
      operationId: appAuthGatewayRefresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                device:
                  type:
                  - string
                  - 'null'
              type: object
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/AppAuthGatewayTokenSchema'
                type: object
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBagSchema'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
      security:
      - token: []
  /app/auth/gateway/revoke:
    post:
      tags:
      - App/Auth/Gateway
      operationId: appAuthGatewayRevoke
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                device:
                  type:
                  - string
                  - 'null'
              type: object
      responses:
        '204':
          description: Successful
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBagSchema'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
      security:
      - token: []
components:
  schemas:
    AppAuthGatewayTokenSchema:
      required:
      - userId
      - accessToken
      properties:
        userId:
          type: integer
        accessToken:
          type: string
      type: object
    ErrorSchema:
      required:
      - errors
      properties:
        error:
          type: string
        message:
          type:
          - string
          - 'null'
      type: object
    ErrorBagSchema:
      required:
      - errors
      properties:
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      type: object
  securitySchemes:
    token:
      type: apiKey
      description: Bearer token authorization
      name: authorization
      in: header
