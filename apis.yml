apis:
- name: Optimyzee Application API
  description: >-
    The REST API behind the Optimyzee web application. Covers Google Ads campaign creation
    (search creation, AI search creation, keyword planner, RSA builder, sitelink builder),
    analysis (account audit, account health, search-terms optimization, Performance Max
    optimization and the P-Max center, reporting editor/querier), account linking (Google
    Ads, Meta, Merchant Center), lookups (campaigns, geo target constants, language
    constants), campaign lifecycle and activity, recommendations and signals, automations,
    Yelp Ads (autoresponders, leads, businesses, programs, reporting, sync), billing
    subscriptions, authentication (email, social gateway, password, TFA, trusted devices),
    plus an internal /operations administrative surface. The OpenAPI 3.0.0 document is
    served publicly and anonymously; there is no developer portal, human API reference,
    or published API program around it.
