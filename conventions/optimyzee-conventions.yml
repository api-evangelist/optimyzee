note: >-
  Optimyzee publishes no developer documentation, so every convention below is read either from the
  harvested OpenAPI document or from headers observed on a live anonymous request. Nothing is inferred
  from a docs page, because there is no docs page.

authentication:
  style: bearer-token-in-authorization-header
  scheme_name: token
  scheme_type: apiKey
  in: header
  parameter: authorization
  description: Bearer token authorization
  applied_to_operations: 108
  unauthenticated_operations: 76
  note: >-
    Declared as an OpenAPI apiKey scheme in the `authorization` header rather than as
    `http`/`bearer`, but the scheme description says "Bearer token authorization". Tokens are minted by
    the /app/auth/gateway/* operations (email, emailSignup, google, googleSignup, facebook,
    facebookSignup) and rotated via appAuthGatewayRefresh / appAuthGatewayRevoke. There is no OAuth 2.0
    authorization server, no scope surface, and no user-facing API key issuance.
  see: authentication/optimyzee-authentication.yml

idempotency:
  supported: false
  header: null
  evidence: >-
    No Idempotency-Key header, no idempotency parameter and no occurrence of the string "idempoten"
    anywhere in the 552KB OpenAPI document. Retry-safety of the POST operations is undocumented.

pagination:
