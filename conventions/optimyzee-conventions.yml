  response_headers:
  - x-pagination-next
  - x-pagination-previous
  - x-pagination-per-page
  - x-pagination-last
  - x-pagination-total
  header_evidence: >-
    Observed live 2026-08-12 - every response from https://api.optimyzee.com carries
    `access-control-expose-headers: x-pagination-next, x-pagination-previous, x-pagination-per-page,
    x-pagination-last, x-pagination-total`, which is how a browser client is granted read access to the
    pagination cursors. The headers themselves are NOT declared in the OpenAPI document, so an agent
    reading only the spec would never learn how to page.
  note: >-
    A separate non-cursor `limit` query parameter appears on 4 lookup operations
    (appLookupGoogleAds*), so pagination is not uniform across the surface.

