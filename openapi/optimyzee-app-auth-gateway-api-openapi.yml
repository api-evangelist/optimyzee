openapi: 3.2.0
info:
  title: Optimyzee Application App/Auth/Gateway API
  version: 4.1.0
  x-original-title: API
  description: App/Auth/Gateway
servers:
- url: https://api.optimyzee.com
  description: Production (host serving this document at /docs)
tags:
- name: App/Auth/Gateway
  description: App/Auth/Gateway
paths:
  /app/auth/gateway/email:
    post:
      tags:
      - App/Auth/Gateway
      operationId: appAuthGatewayEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
              - email
              - password
              properties:
                email:
                  type: string
                password:
                  type: string
                device:
                  type:
                  - string
                  - 'null'
                otp:
                  type:
                  - string
                  - 'null'
                otpRecoveryCode:
                  type:
                  - string
                  - 'null'
              type: object
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/AppAuthGatewayTokenSchema'
                type: object
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBagSchema'
        '400':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
  /app/auth/gateway/emailSignup:
